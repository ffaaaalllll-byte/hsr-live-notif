name: Check Honkai Star Rail Live Status

on:
  schedule:
    # Every 15 minutes. Keep this at 15+ minutes to stay within YouTube's
    # free daily API quota (see README).
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      test_notification:
        description: 'Send a sample Discord message instead of checking real live status'
        required: false
        type: boolean
        default: false

permissions:
  contents: write # needed so the workflow can commit the updated state.json

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run live check
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_NOTIFICATION: ${{ inputs.test_notification }}
        run: node check.js

      - name: Commit updated state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update live-notification state"
          git push
